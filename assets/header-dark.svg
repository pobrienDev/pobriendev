<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 248" width="840" height="248" role="img" aria-labelledby="t d">
<title id="t">Patrick O'Brien, Software Engineer</title>
<desc id="d">A terminal window types the command whoami and prints: Patrick O'Brien, Software Engineer, identity and access automation, full-stack web apps, Baltimore, Maryland.</desc>
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:15px}
  .c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:15px;fill:#E7EBEF;animation:show .01s linear both}
  .fade{animation:fadeup .45s ease-out both}
  .cur1{opacity:0;animation:move 0.66s steps(6,end) 0.71s forwards, on 1.52s linear 0s 1}
  .cur2{animation:off 2.72s linear 0s 1, blink 1.1s steps(1,end) 2.72s infinite}
  @keyframes show{from{opacity:0}to{opacity:1}}
  @keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  @keyframes move{to{transform:translateX(55.2px)}}
  @keyframes on{from,to{opacity:1}}
  @keyframes off{from,to{opacity:0}}
  @keyframes blink{0%{opacity:1}50%{opacity:0}100%{opacity:0}}
  @media (prefers-reduced-motion: reduce){
    .c,.fade,.cur1,.cur2{animation:none}
  }
</style>
