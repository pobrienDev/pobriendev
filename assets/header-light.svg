<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 248" width="840" height="248" role="img" aria-labelledby="t d">
<title id="t">Patrick O'Brien, Software Engineer</title>
<desc id="d">A terminal window types the command whoami and prints: Patrick O'Brien, Software Engineer, identity and access automation, full-stack web apps, Baltimore, Maryland.</desc>
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:15px}
  .c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:15px;fill:#1F2328;opacity:0;animation:show .01s linear forwards}
  .fade{opacity:0;animation:fadeup .45s ease-out forwards}
  .cur1{animation:move 0.66s steps(6,end) 0.71s forwards, hide .01s linear 1.52s forwards}
  .cur2{opacity:0;animation:blink 1.1s steps(1,end) 2.72s infinite}
  @keyframes show{to{opacity:1}}
  @keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  @keyframes move{to{transform:translateX(55.2px)}}
  @keyframes hide{to{opacity:0}}
  @keyframes blink{0%{opacity:1}50%{opacity:0}100%{opacity:0}}
  @media (prefers-reduced-motion: reduce){
    .c,.fade{animation:none;opacity:1}
    .cur1{animation:none;opacity:0}
    .cur2{animation:none;opacity:1}
  }
</style>
